name: CIVAJS site checks

on:
  push:
    branches: [main, trust-and-intake-safety]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML scripts, structured data and trust disclosures
        run: node scripts/validate.mjs
